services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-searchy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  s3mock:
    image: adobe/s3mock:latest
    restart: always
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: searchy-files
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    ports:
      - "9090:9090"
    volumes:
      - s3data:/s3mockroot

  s3manager:
    image: cloudlena/s3manager:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      ENDPOINT: s3mock:9090
      USE_SSL: "false"
      REGION: us-east-1
      ACCESS_KEY_ID: dummy
      SECRET_ACCESS_KEY: dummy
      ALLOW_DELETE: "true"
      FORCE_PATH_STYLE: "true"
    depends_on:
      - s3mock

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  s3data:
  redisdata:
