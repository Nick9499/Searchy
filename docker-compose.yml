services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-searchy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  s3mock:
    image: adobe/s3mock:latest
    restart: always
    environment:
      initialBuckets: searchy-files
    ports:
      - "9090:9090"

volumes:
  pgdata:
