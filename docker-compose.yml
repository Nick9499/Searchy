services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-searchy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  s3mock:
    image: adobe/s3mock:latest
    restart: always
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: searchy-files
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    ports:
      - "9090:9090"
    volumes:
      - s3data:/s3mockroot

  s3manager:
    image: cloudlena/s3manager:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      ENDPOINT: s3mock:9090
      USE_SSL: "false"
      REGION: us-east-1
      ACCESS_KEY_ID: dummy
      SECRET_ACCESS_KEY: dummy
      ALLOW_DELETE: "true"
      FORCE_PATH_STYLE: "true"
    depends_on:
      - s3mock

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      target: dev
    restart: always
    ports: ["5000:5000"]
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-searchy}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ap-southeast-2}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey12345678901234567890}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5000/api/integrations/google/callback}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      # Mount your local source code for live-reload without rebuilding the container!
      - ./src:/app/src
      - /app/node_modules # prevent host node_modules from overwriting container node_modules
    depends_on:
      - db
      - redis
      - s3mock

volumes:
  pgdata:
  s3data:
  redisdata:
